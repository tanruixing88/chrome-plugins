<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="buttons">
        <button id="expandBtn">展开JSON</button>
        <button id="compressBtn">压缩JSON</button>
        <button id="copyBtn">复制结果</button>
      </div>
    </div>
    <textarea id="jsonInput" placeholder="在此粘贴您的JSON数据..."></textarea>
    <div id="status"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
